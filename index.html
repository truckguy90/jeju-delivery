<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>제주 배송 내비 원터치 & 실시간 스케줄러</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icon CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Leaflet 지도 라이브러리 CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body {
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #020617;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        #container-map {
            width: 100% !important;
            height: 100% !important;
            min-height: 100% !important;
            position: relative;
        }
        #map {
            width: 100% !important;
            height: 100% !important;
            background-color: #0b1329;
        }
        .map-pin {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: #ffffff;
            font-weight: 900;
            font-size: 12px;
            border: 2px solid #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
            transition: transform 0.15s ease-in-out;
        }
        .hub-pin {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            color: #ffffff;
            font-weight: 900;
            font-size: 11px;
            border: 2px solid #ffffff;
            box-shadow: 0 3px 8px rgba(0,0,0,0.6);
            padding: 3px 8px;
            white-space: nowrap;
        }
        .compact-card {
            border-left-width: 4px;
        }
    </style>
</head>
<body class="text-slate-100 flex flex-col select-none">

    <!-- 상단 고정 헤더 -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 px-3 py-2 shadow-xl shrink-0">
        <!-- 1행: 타이틀 및 전체 복사 -->
        <div class="max-w-md mx-auto flex justify-between items-center mb-1.5">
            <div>
                <span class="text-[10px] font-bold text-sky-400 tracking-wider uppercase block">카카오내비 전용 연동 도구</span>
                <h1 class="text-sm font-black text-white flex items-center gap-1.5">
                    <i class="fa-solid fa-truck-ramp-box text-sky-400"></i>
                    제주 배송 실시간 스케줄러
                </h1>
            </div>
            <div class="flex items-center gap-1.5">
                <button onclick="openTimeAdjustModal()" class="text-xs bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 font-bold px-2 py-1.5 rounded-xl border border-slate-700 transition flex items-center gap-1">
                    <i class="fa-solid fa-stopwatch text-[11px] text-amber-400"></i>
                    <span>기준시간</span>
                </button>
                <button onclick="resetOriginalOrder()" class="text-xs bg-slate-800 hover:bg-slate-700 active:scale-95 text-amber-300 font-bold px-2 py-1.5 rounded-xl border border-slate-700 transition flex items-center gap-1" title="원래 순서로 복원">
                    <i class="fa-solid fa-rotate-left text-[11px]"></i>
                    <span>순서원복</span>
                </button>
                <button onclick="copyAllAddresses()" class="text-xs bg-sky-600 hover:bg-sky-500 active:scale-95 text-white font-bold px-2.5 py-1.5 rounded-xl transition flex items-center gap-1 shadow">
                    <i class="fa-regular fa-copy text-xs"></i>
                    <span>전체 복사</span>
                </button>
            </div>
        </div>

        <!-- 2행: 회차 선택 드롭박스 & 하차시간 설정 -->
        <div class="max-w-md mx-auto grid grid-cols-3 gap-1.5 mb-1.5">
            <!-- 회차 선택 드롭다운 -->
            <div class="col-span-2 relative">
                <select id="session-selector" onchange="onSessionChange(this.value)" class="w-full bg-slate-950 border border-sky-500/40 text-white font-bold text-xs rounded-xl px-2.5 py-1.5 focus:outline-none focus:border-sky-400 truncate appearance-none pr-7 shadow-inner">
                    <optgroup label="⭐ 오늘 배송 (18일)">
                        <option value="18_pm" selected>18일 오후 (탐라모터스 / 시에나CC 마감)</option>
                        <option value="18_am">18일 오전 (시에나 1번 / 이마트 복귀)</option>
                    </optgroup>
                    <optgroup label="지난 운행 보관함 (과거 기록)">
                        <option value="17_pm">17일 오후 (애월 마무리)</option>
                        <option value="17_am">17일 오전 (이마트 출발/복귀)</option>
                        <option value="16_pm">16일 오후 (스프링데일/번영로)</option>
                        <option value="16_am">16일 오전 (대정 우선/이마트)</option>
                    </optgroup>
                </select>
                <i class="fa-solid fa-chevron-down text-slate-400 text-[10px] absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
            </div>

            <!-- 하차 기준 시간 드롭다운 -->
            <div class="relative">
                <select id="unload-duration-select" onchange="onUnloadDurationChange(this.value)" class="w-full bg-slate-950 border border-slate-700 text-amber-300 font-bold text-xs rounded-xl px-2 py-1.5 focus:outline-none focus:border-amber-400 appearance-none pr-6 text-center">
                    <option value="10">하차 10분</option>
                    <option value="12">하차 12분</option>
                    <option value="15" selected>하차 15분</option>
                    <option value="20">하차 20분</option>
                </select>
                <i class="fa-solid fa-angle-down text-slate-400 text-[9px] absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none"></i>
            </div>
        </div>

        <!-- 3행: 실시간 재계산 지표 카드 -->
        <div class="max-w-md mx-auto bg-slate-950/90 border border-slate-800 rounded-xl p-1.5 grid grid-cols-4 gap-1 text-center text-xs">
            <div>
                <span class="text-[9px] text-slate-400 block font-medium">총 주행거리</span>
                <strong id="summary-dist" class="text-sky-400 font-mono font-bold text-xs">37.1 km</strong>
            </div>
            <div class="border-l border-slate-800">
                <span class="text-[9px] text-slate-400 block font-medium">총 물량</span>
                <strong id="summary-qty" class="text-amber-400 font-mono font-bold text-xs">423 박스</strong>
            </div>
            <div class="border-l border-slate-800">
                <span class="text-[9px] text-slate-400 block font-medium flex items-center justify-center gap-0.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span>예상 마감</span>
                </span>
                <strong id="summary-finish" class="text-emerald-400 font-mono font-bold text-xs">16:08</strong>
            </div>
            <div class="border-l border-slate-800">
                <span class="text-[9px] text-slate-400 block font-medium">하차 완료</span>
                <strong id="summary-progress" class="text-white font-mono font-bold text-xs">0 / 5 (0%)</strong>
            </div>
        </div>

        <!-- 4행: 실시간 상태 알림 배너 & 뷰 모드 스위치 -->
        <div class="max-w-md mx-auto mt-1.5 flex items-center justify-between gap-1.5">
            <div id="live-status-chip" class="flex-1 bg-slate-950 border border-slate-800 px-2.5 py-1 rounded-lg text-[10px] text-slate-300 truncate flex items-center gap-1.5">
                <i class="fa-solid fa-clock-rotate-left text-sky-400 text-[10px]"></i>
                <span id="live-status-text">14:00 출발 기준 타임라인 산출 중</span>
            </div>
            <div class="grid grid-cols-2 gap-1 bg-slate-950 p-0.5 rounded-lg border border-slate-800 shrink-0">
                <button onclick="switchView('list')" id="view-btn-list" class="py-1 px-2 rounded text-[11px] font-bold transition bg-sky-600 text-white flex items-center gap-1">
                    <i class="fa-solid fa-list-check text-[10px]"></i>
                    <span>목록</span>
                </button>
                <button onclick="switchView('map')" id="view-btn-map" class="py-1 px-2 rounded text-[11px] font-bold transition text-slate-400 hover:text-white flex items-center gap-1">
                    <i class="fa-solid fa-map text-[10px]"></i>
                    <span>지도</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 복사 알림 토스트 -->
    <div id="toast" class="fixed top-28 left-1/2 -translate-x-1/2 z-50 bg-emerald-600 text-white text-xs font-bold px-4 py-2 rounded-full shadow-2xl flex items-center gap-1.5 opacity-0 pointer-events-none transition-opacity duration-200">
        <i class="fa-solid fa-check text-xs"></i>
        <span id="toast-text">복사되었습니다.</span>
    </div>

    <!-- 메인 컨테이너 -->
    <main class="flex-1 max-w-md w-full mx-auto relative overflow-hidden flex flex-col min-h-0">
        <!-- 1. 목록 뷰 -->
        <div id="container-list" class="flex-1 w-full h-full p-2.5 space-y-2 overflow-y-auto pb-28">
            <!-- JS 동적 렌더링 -->
        </div>

        <!-- 2. 인터랙티브 지도 뷰 -->
        <div id="container-map" class="w-full h-full relative hidden flex-1">
            <div id="map"></div>
            <!-- 지도 퀵 카드 -->
            <div id="map-quick-card" class="absolute bottom-4 left-3 right-3 bg-slate-900/95 backdrop-blur border border-slate-700 rounded-2xl p-3 shadow-2xl z-[1000] space-y-2">
                <div class="flex justify-between items-start">
                    <div class="flex items-center gap-2 min-w-0 flex-1 pr-2">
                        <span id="mq-badge" class="w-6 h-6 rounded-full bg-sky-500 text-slate-950 font-black text-xs flex items-center justify-center shrink-0">1</span>
                        <div class="min-w-0">
                            <h3 id="mq-title" class="text-sm font-bold text-white truncate">배송지명</h3>
                            <span id="mq-addr" class="text-[10px] text-amber-300 font-mono block truncate">주소</span>
                        </div>
                    </div>
                    <span id="mq-time" class="text-xs font-mono font-bold text-sky-400 bg-slate-800 px-2 py-0.5 rounded shrink-0">00:00 도착</span>
                </div>
                <div class="grid grid-cols-3 gap-1.5 pt-1">
                    <button id="mq-btn-title" class="bg-slate-800 active:scale-95 py-1.5 rounded-lg text-xs font-bold text-sky-300 border border-slate-700">
                        타이틀 복사
                    </button>
                    <button id="mq-btn-addr" class="bg-sky-600 active:scale-95 py-1.5 rounded-lg text-xs font-bold text-white shadow">
                        주소 복사
                    </button>
                    <a id="mq-btn-tel" href="#" class="bg-emerald-700 active:scale-95 py-1.5 rounded-lg text-xs font-bold text-white text-center flex items-center justify-center gap-1 shadow">
                        <i class="fa-solid fa-phone text-[10px]"></i>
                        <span>통화</span>
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- 기준 시간 수동 변경 모달 -->
    <div id="modal-time" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-xs p-4 space-y-3 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <h3 class="font-bold text-sm text-white flex items-center gap-1.5">
                    <i class="fa-solid fa-clock text-amber-400"></i> 출발 기준 시간 설정
                </h3>
                <button onclick="closeTimeModal()" class="text-slate-400 hover:text-white text-base">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="space-y-2 text-xs">
                <p class="text-[11px] text-slate-400">
                    오후 출차 시각을 입력하시면 남은 배송지의 도착 및 최종 마감 시간이 실시간 재계산됩니다.
                </p>
                <div class="flex items-center justify-center p-2 bg-slate-950 rounded-xl border border-slate-800">
                    <input type="time" id="input-session-start" class="bg-slate-900 border border-slate-700 text-white font-mono font-bold text-base px-3 py-1.5 rounded-lg focus:outline-none focus:border-sky-500">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-2 pt-1 border-t border-slate-800">
                <button onclick="closeTimeModal()" class="py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-bold">취소</button>
                <button onclick="applySessionStartTime()" class="py-2 bg-sky-600 text-white rounded-xl text-xs font-bold shadow">적용하기</button>
            </div>
        </div>
    </div>

        function parseTimeToMinutes(tStr) {
            const parts = tStr.split(':').map(Number);
            return parts[0] * 60 + parts[1];
        }

        function formatMinutesToTime(min) {
            const h = Math.floor(min / 60) % 24;
            const m = Math.floor(min % 60);
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        }

        function getCurrentTimeStr() {
            const now = new Date();
            return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        }

        // 실시간 일정 재계산 엔진
        function recalculateLiveSchedule() {
            let runningMinutes = parseTimeToMinutes(sessionStartTimeStr);
            let totalKm = 0;
            let totalBoxes = 0;
            let lastCompletedStopName = null;
            let lastCompletedTime = null;
            let deliverySeqCounter = 1;

            currentStops.forEach((stop) => {
                const isStartHub = !!stop.isStartPoint;
                const isEndHub = !!stop.isEndPoint;

                totalKm += (stop.roadKm || 0);

                if (!isStartHub && !isEndHub) {
                    const qNum = parseInt(stop.boxQty) || 0;
                    totalBoxes += qNum;
                }

                const isDone = !!completedMap[stop.id];
                const recordedDoneTime = completedTimestampMap[stop.id];

                if (isStartHub) {
                    stop.arrTime = formatMinutesToTime(runningMinutes);
                    stop.deptTime = formatMinutesToTime(runningMinutes);
                    stop.displaySeq = "출";
                    return;
                }

                if (isEndHub) {
                    runningMinutes += (stop.driveMin || 7);
                    stop.arrTime = formatMinutesToTime(runningMinutes);
                    stop.deptTime = formatMinutesToTime(runningMinutes);
                    stop.displaySeq = "착";
                    return;
                }

                // 일반 배송지
                runningMinutes += (stop.driveMin || 8);
                stop.arrTime = formatMinutesToTime(runningMinutes);
                stop.displaySeq = deliverySeqCounter++;

                const thisUnloadMin = stop.customUnload !== undefined ? stop.customUnload : fixedUnloadMin;

                if (isDone && recordedDoneTime) {
                    stop.deptTime = recordedDoneTime;
                    runningMinutes = parseTimeToMinutes(recordedDoneTime);
                    lastCompletedStopName = stop.name;
                    lastCompletedTime = recordedDoneTime;
                } else {
                    runningMinutes += thisUnloadMin;
                    stop.deptTime = formatMinutesToTime(runningMinutes);
                }
            });

            const finishTimeStr = formatMinutesToTime(runningMinutes);

            document.getElementById('summary-dist').innerText = `${totalKm.toFixed(1)} km`;
            document.getElementById('summary-qty').innerText = `${totalBoxes} 박스`;
            document.getElementById('summary-finish').innerText = finishTimeStr;

            const statusTextEl = document.getElementById('live-status-text');
            if (lastCompletedStopName && lastCompletedTime) {
                statusTextEl.innerHTML = `<b class="text-emerald-400">[${lastCompletedStopName}]</b> ${lastCompletedTime} 완료 기준 실시간 재산출됨`;
            } else {
                statusTextEl.innerText = `${sessionStartTimeStr} 출발 기준 타임라인 산출 중 (탐라모터스 240박스 하차)`;

            updateProgressStat();

            let pct = total > 0 ? Math.round((doneCount / total) * 100) : 0;
            document.getElementById('summary-progress').innerText = `${doneCount} / ${total} (${pct}%)`;
        }

                                <!-- 순서 위/아래 이동 버튼 -->
                                <div class="flex items-center bg-slate-950 rounded-lg border border-slate-800 p-0.5">
                                    <button onclick="moveStop('${item.id}', -1)" title="순서 위로" class="w-5 h-5 flex items-center justify-center text-[9px] text-slate-300 hover:text-white active:scale-90">
                                        <i class="fa-solid fa-chevron-up"></i>
                                    </button>
                                    <button onclick="moveStop('${item.id}', 1)" title="순서 아래로" class="w-5 h-5 flex items-center justify-center text-[9px] text-slate-300 hover:text-white active:scale-90">
                                        <i class="fa-solid fa-chevron-down"></i>
                                    </button>
                                </div>

                                <div class="text-right">
                                    <span class="font-mono text-xs font-bold ${isDone ? 'text-emerald-400' : 'text-sky-400'} block">
                                        ${isDone ? `${doneTime} 완료` : `${item.arrTime} 도착`}
                                    </span>
                                    <span class="text-[9px] text-slate-500 font-mono block">
                                        ${item.roadKm}km (${item.driveMin}분)
                                    </span>
                                </div>
                                <button onclick="toggleComplete('${item.id}')" class="text-[10px] font-bold px-2 py-1 rounded-lg border transition active:scale-95 ${
                                    isDone 
                                        ? 'bg-emerald-950 border-emerald-500/50 text-emerald-300' 
                                        : 'bg-slate-800 border-slate-700 text-slate-300 hover:text-white hover:bg-slate-700'
                                }">
                                    ${isDone ? '완료됨' : '하차완료'}
                                </button>
                            </div>
                        </div>

                        <!-- 라인 2: 정제 도로명 주소 & 원터치 주소 복사 -->
                        <div class="bg-slate-950/80 rounded-lg p-1.5 mb-1.5 flex items-center justify-between gap-1.5 border border-slate-800">
                            <span class="text-xs font-mono font-bold text-amber-300 truncate pl-1">
                                ${item.address}
                            </span>
                            <button onclick="copyText('${item.address}', '주소')" class="shrink-0 bg-sky-600 hover:bg-sky-500 active:scale-95 px-2.5 py-1 rounded-md text-xs font-bold text-white shadow flex items-center gap-1">
                                <i class="fa-solid fa-location-arrow text-[10px]"></i>
                                <span>주소 복사</span>
                            </button>
                        </div>

                        <!-- 라인 3: 참고사항 및 퀵 액션 (1번지정, 타이틀 복사, 통화) -->
                        <div class="flex items-center justify-between gap-1 text-[10px]">
                            <div class="truncate text-slate-400 flex-1 pr-1">
                                <i class="fa-solid fa-circle-info text-sky-400 mr-0.5"></i>
                                <span>${item.note}</span>
                            </div>

                            <div class="flex items-center gap-1 shrink-0">
                                <button onclick="setAsFirstStop('${item.id}')" class="bg-slate-800 active:scale-95 px-1.5 py-1 rounded text-[10px] font-bold text-amber-300 border border-slate-700" title="첫 번째 하차지로 지정">
                                    1번지정
                                </button>
                                <button onclick="copyText('${titleStr}', '타이틀')" class="bg-slate-800 active:scale-95 px-2 py-1 rounded text-[10px] font-bold text-sky-300 border border-slate-700">
                                    타이틀
                                </button>
                                ${item.phone ? `
                                    <a href="tel:${item.phone}" class="bg-emerald-700 active:scale-95 px-2 py-1 rounded text-[10px] font-bold text-white shadow flex items-center gap-0.5">
                                        <i class="fa-solid fa-phone text-[8px]"></i>
                                        <span>통화</span>
                                    </a>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Leaflet 지도 렌더링 엔진 완벽 복원
        function initMapIfNeeded() {
            const mapEl = document.getElementById('map');
            if (!mapEl) return;

            if (!mapInstance) {
                mapInstance = L.map('map', {
                    zoomControl: false,
                    attributionControl: false
                }).setView([33.35, 126.55], 11);

                L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19
                }).addTo(mapInstance);

                markersLayer = L.layerGroup().addTo(mapInstance);
            }
        }

        function renderMap() {
            initMapIfNeeded();
            if (!mapInstance || !markersLayer) return;

            markersLayer.clearLayers();
            if (routeLine) {
                mapInstance.removeLayer(routeLine);
                routeLine = null;
            }

            const currentSession = MASTER_SESSIONS[currentSessionKey];
            const latlngs = [];

            // 1. 출발 거점 마커 (이마트 서귀포점)
            if (currentSession.startHub) {
                const startPt = [currentSession.startHub.lat, currentSession.startHub.lon];
                latlngs.push(startPt);

                L.marker(startPt, {
                    icon: L.divIcon({
                        className: 'hub-pin-icon',
                        html: `<div class="hub-pin" style="background:#e11d48;"><i class="fa-solid fa-play mr-1 text-[9px]"></i>출발: ${currentSession.startHub.name}</div>`,
                        iconSize: [120, 24],
                        iconAnchor: [60, 12]
                    })
                }).addTo(markersLayer);
            }

            // 2. 배송지 핀들
            currentStops.forEach((item) => {
                if (item.isStartPoint || item.isEndPoint) return;
                const pt = [item.lat, item.lon];
                latlngs.push(pt);

                const isDone = !!completedMap[item.id];
                const isBulk = item.boxQty && item.boxQty.includes("240");
                const pinColor = isDone ? '#10b981' : (isBulk ? '#f43f5e' : '#0ea5e9');

                const m = L.marker(pt, {
                    icon: L.divIcon({
                        className: 'custom-pin-icon',
                        html: `<div class="map-pin" style="background-color: ${pinColor}; width: 28px; height: 28px;">${isDone ? '✓' : item.displaySeq}</div>`,
                        iconSize: [28, 28],
                        iconAnchor: [14, 14]
                    })
                }).addTo(markersLayer);

                m.on('click', () => {
                    updateMapQuickCard(item);
                });
            });

            // 3. 복귀 거점 마커 (있을 경우)
            if (currentSession.returnHub) {
                const endPt = [currentSession.returnHub.lat, currentSession.returnHub.lon];
                latlngs.push(endPt);

                L.marker(endPt, {
                    icon: L.divIcon({
                        className: 'hub-pin-icon',
                        html: `<div class="hub-pin" style="background:#059669;"><i class="fa-solid fa-flag-checkered mr-1 text-[9px]"></i>복귀: ${currentSession.returnHub.name}</div>`,
                        iconSize: [120, 24],
                        iconAnchor: [60, 12]
                    })
                }).addTo(markersLayer);
            }

            // 경로선 연결
            if (latlngs.length > 1) {
                routeLine = L.polyline(latlngs, {
                    color: '#38bdf8',
                    weight: 4,
                    opacity: 0.85,
                    dashArray: '6, 6'
                }).addTo(mapInstance);

                setTimeout(() => {
                    if (mapInstance && routeLine) {
                        mapInstance.invalidateSize(true);
                        mapInstance.fitBounds(routeLine.getBounds(), { padding: [40, 40] });
                    }
                }, 100);
            }

            const firstDeliverable = currentStops.find(s => !s.isStartPoint && !s.isEndPoint);
            if (firstDeliverable) {
                updateMapQuickCard(firstDeliverable);
            }
        }

        function updateMapQuickCard(item) {
            const isDone = !!completedMap[item.id];
            const titleStr = `${item.displaySeq} ${item.name}`;
            document.getElementById('mq-badge').innerText = isDone ? '✓' : item.displaySeq;
            document.getElementById('mq-title').innerText = `${titleStr} (${item.boxQty})`;
            document.getElementById('mq-addr').innerText = item.address;
            document.getElementById('mq-time').innerText = isDone ? `${completedTimestampMap[item.id]} 완료` : `${item.arrTime} 도착`;

            document.getElementById('mq-btn-title').onclick = () => copyText(titleStr, '타이틀');
            document.getElementById('mq-btn-addr').onclick = () => copyText(item.address, '주소');
            const telLink = document.getElementById('mq-btn-tel');
            if (item.phone) {
                telLink.href = `tel:${item.phone}`;
                telLink.classList.remove('opacity-40', 'pointer-events-none');
            } else {
                telLink.href = '#';
                telLink.classList.add('opacity-40', 'pointer-events-none');
            }
        }

        function moveStop(stopId, direction) {
            const curIdx = currentStops.findIndex(s => s.id === stopId);
            if (curIdx === -1) return;

            const firstDeliverableIdx = currentStops.findIndex(s => !s.isStartPoint);
            const lastDeliverableIdx = currentStops.map(s => !s.isEndPoint).lastIndexOf(true);
            const targetIdx = curIdx + direction;

            if (targetIdx < firstDeliverableIdx || targetIdx > lastDeliverableIdx) {
                return;
            }

            const temp = currentStops[curIdx];
            currentStops[curIdx] = currentStops[targetIdx];
            currentStops[targetIdx] = temp;

            renderAll();
            showToast(`[${temp.name}] 순서가 변경되었습니다.`);
        }

        function setAsFirstStop(stopId) {
            const curIdx = currentStops.findIndex(s => s.id === stopId);
            if (curIdx === -1) return;

            const firstDeliverableIdx = currentStops.findIndex(s => !s.isStartPoint);
            if (curIdx === firstDeliverableIdx) {
                showToast(`이미 첫 번째 하차지입니다.`);
                return;
            }

            const [selected] = currentStops.splice(curIdx, 1);
            currentStops.splice(firstDeliverableIdx, 0, selected);

            renderAll();
            showToast(`[${selected.name}]이(가) 1번 하차지로 지정되었습니다.`);
        }

        function resetOriginalOrder() {
            const sessionData = MASTER_SESSIONS[currentSessionKey];
            currentStops = JSON.parse(JSON.stringify(sessionData.stops));
            renderAll();
            showToast(`배송 순서가 기본 계획으로 복원되었습니다.`);
        }

        function onSessionChange(newKey) {
            currentSessionKey = newKey;
            const sessionData = MASTER_SESSIONS[newKey];
            currentStops = JSON.parse(JSON.stringify(sessionData.stops));
            sessionStartTimeStr = sessionData.defaultStartTime;
            completedMap = {};
            completedTimestampMap = {};

            document.getElementById('input-session-start').value = sessionStartTimeStr;

            renderAll();
            showToast(`[${sessionData.name}] 회차로 전환되었습니다.`);
        }

        function onUnloadDurationChange(val) {
            fixedUnloadMin = parseInt(val, 10);
            renderAll();
            showToast(`개소당 기본 하차 시간이 ${fixedUnloadMin}분으로 설정되었습니다.`);
        }

        function switchView(viewKey) {
            currentView = viewKey;
            const btnList = document.getElementById('view-btn-list');
            const btnMap = document.getElementById('view-btn-map');
            const cList = document.getElementById('container-list');
            const cMap = document.getElementById('container-map');

            if (viewKey === 'list') {
                btnList.className = "py-1 px-2 rounded text-[11px] font-bold transition bg-sky-600 text-white flex items-center gap-1";
                btnMap.className = "py-1 px-2 rounded text-[11px] font-bold transition text-slate-400 hover:text-white flex items-center gap-1";
                cList.classList.remove('hidden');
                cMap.classList.add('hidden');
            } else {
                btnMap.className = "py-1 px-2 rounded text-[11px] font-bold transition bg-sky-600 text-white flex items-center gap-1";
                btnList.className = "py-1 px-2 rounded text-[11px] font-bold transition text-slate-400 hover:text-white flex items-center gap-1";
                cList.classList.add('hidden');
                cMap.classList.remove('hidden');

                // 지도가 표시되는 시점에 Leaflet 컨테이너 크기를 강제 재연산하여 타일 깨짐/미표시 원천 차단
                setTimeout(() => {
                    renderMap();
                }, 100);
            }
        }

        function renderAll() {
            recalculateLiveSchedule();
            renderCards();
            if (currentView === 'map') {
                renderMap();
            }
        }

        function openTimeAdjustModal() {
            document.getElementById('input-session-start').value = sessionStartTimeStr;
            document.getElementById('modal-time').classList.remove('hidden');
        }

        function closeTimeModal() {
            document.getElementById('modal-time').classList.add('hidden');
        }

        function applySessionStartTime() {
            const val = document.getElementById('input-session-start').value;
            if (val) {
                sessionStartTimeStr = val;
                closeTimeModal();
                renderAll();
                showToast(`출발 기준 시간이 ${sessionStartTimeStr}로 변경되었습니다.`);
            }
        }

        function copyText(text, label) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.top = '0';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();

            let success = false;
            try {
                success = document.execCommand('copy');
            } catch (err) {
                success = false;
            }
            document.body.removeChild(ta);

            if (success) {
                showToast(`[${label}] 복사: ${text}`);
            } else {
                window.prompt("아래 텍스트를 복사하세요:", text);
            }
        }

        function copyAllAddresses() {
            const sName = MASTER_SESSIONS[currentSessionKey].name;
            let full = `[${sName} 배송 목록]\n`;
            currentStops.forEach(s => {
                if (s.isStartPoint) {
                    full += `(출발 거점) ${s.name}: ${s.address}\n`;
                } else if (s.isEndPoint) {
                    full += `(최종 복귀) ${s.name}: ${s.address}\n`;
                } else {
                    full += `${s.displaySeq} ${s.name}: ${s.address} (${s.boxQty}) - ${s.phone || '연락처 없음'}\n`;
                }
            });
            copyText(full, "전체 목록");
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toast-text');
            toastText.innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 1900);
        }

        window.addEventListener('resize', () => {
            if (mapInstance && currentView === 'map') {
                mapInstance.invalidateSize(true);
            }
        });

        // 앱 최초 기동 (18일 오후 기본 로드)
        window.addEventListener('DOMContentLoaded', () => {
            onSessionChange("18_pm");
        });
    </script>
</body>
</html>
