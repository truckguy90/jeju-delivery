<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>배송 내비 원터치 복사기</title>
    <!-- 모바일 웹앱/PWA 설정 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icon CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col select-none">

    <!-- 상단 고정 헤더 -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 px-4 py-3 shadow-xl">
        <div class="max-w-md mx-auto flex justify-between items-center mb-2">
            <div>
                <span class="text-[10px] font-bold text-sky-400 tracking-wider uppercase block">카카오내비 연동 지원도구</span>
                <h1 class="text-base font-black text-white flex items-center gap-1.5">
                    배송지 원터치 복사기
                </h1>
            </div>
            <button onclick="copyAllAddresses()" class="text-xs bg-sky-600 hover:bg-sky-500 active:scale-95 text-white font-bold px-3 py-1.5 rounded-xl transition flex items-center gap-1.5 shadow">
                <i class="fa-regular fa-copy text-xs"></i>
                <span>전체 복사</span>
            </button>
        </div>

        <!-- 오전 / 오후 탭 전환 -->
        <div class="max-w-md mx-auto grid grid-cols-2 gap-1.5 mb-2.5">
            <button onclick="switchTab('pm')" id="tab-pm" class="py-2 rounded-xl text-xs font-bold transition bg-sky-600 text-white shadow">
                16일 오후 (번영로 마감)
            </button>
            <button onclick="switchTab('am')" id="tab-am" class="py-2 rounded-xl text-xs font-bold transition bg-slate-800 text-slate-400">
                16일 오전 (대정 우선)
            </button>
        </div>

        <!-- 운행 지표 요약 바 -->
        <div class="max-w-md mx-auto bg-slate-950/90 border border-slate-800 rounded-xl p-2.5 grid grid-cols-3 gap-2 text-center text-xs">
            <div>
                <span class="text-[10px] text-slate-400 block font-medium">총 주행거리</span>
                <strong id="summary-dist" class="text-sky-400 font-mono font-bold text-sm">53.9 km</strong>
            </div>
            <div class="border-x border-slate-800">
                <span class="text-[10px] text-slate-400 block font-medium">총 물량</span>
                <strong id="summary-qty" class="text-amber-400 font-mono font-bold text-sm">362 박스</strong>
            </div>
            <div>
                <span class="text-[10px] text-slate-400 block font-medium">마감 예정</span>
                <strong id="summary-finish" class="text-emerald-400 font-mono font-bold text-sm">15:58</strong>
            </div>
        </div>

        <!-- 진행 진척도 -->
        <div class="max-w-md mx-auto mt-2 flex justify-between items-center text-[11px] text-slate-400 px-0.5">
            <span>하차 완료: <b id="progress-stat" class="text-white">0 / 8개소 (0%)</b></span>
            <span id="route-desc" class="text-amber-300 font-medium truncate max-w-[170px]">이마트 → 번영로 528</span>
        </div>
    </header>

    <!-- 복사 알림 토스트 (모바일 사파리/크롬 호환) -->
    <div id="toast" class="fixed top-24 left-1/2 -translate-x-1/2 z-50 bg-emerald-600 text-white text-xs font-bold px-4 py-2 rounded-full shadow-2xl flex items-center gap-1.5 opacity-0 pointer-events-none transition-opacity duration-200">
        <i class="fa-solid fa-check text-xs"></i>
        <span id="toast-text">복사되었습니다.</span>
    </div>

    <!-- 배송처 카드 목록 컨테이너 -->
    <main class="flex-1 p-3.5 max-w-md w-full mx-auto space-y-3 pb-24" id="cards-container">
        <!-- JavaScript로 동적 렌더링 -->
    </main>

    <script>
        // 16일 오후 데이터 (이마트 -> 번영로 528 마감)
        const PM_DATA = [
            {
                seq: 1,
                titleName: "삼화페인트",

                phone: "010-5413-1048",
                boxQty: "30박스",

            },
            {

            },
            {

            },
            {
                seq: 4,

                address: "서귀포시 일주동로 8383",
                phone: "010-5659-7036",
                boxQty: "67박스",
                goods: "정관장 홍삼원골드 60포 (67)",
                note: "일주동로변 공조 매장 (오타 국번 정정)",
                arrTime: "14:14"
            },
            {
                seq: 5,
                titleName: "동남산업",
                address: "서귀포시 토평공단로 106번길 18",
                phone: "010-5395-2050",

                goods: "튜나리챔 (16), 참치 M16 (2), 락토핏 (6), 올리브 (3)",
                note: "토평공단 내 공장 (형남건설과 연락처 동일)",
                arrTime: "14:29"
            },
            {
                seq: 6,
                titleName: "삼다감귤영농조합",
                address: "서귀포시 효돈순환로 296",
                phone: "010-7203-1981",
                boxQty: "45박스",
                goods: "청정원 종합 3호 (33), 정담은 표고혼합 (12)",
                note: "사업장 하차장 (효돈순환로 대로변)",
                arrTime: "14:44"
            },
            {
                seq: 7,
                titleName: "스프링데일",
                address: "서귀포시 남원읍 서성로 159",
                phone: "010-7153-2848",
                boxQty: "123박스",
                goods: "CJ 스팸 EM호 (123)",
                note: "스프링데일CC 클럽하우스 (장명학 / 대량 123박스)",
                arrTime: "15:11"
            },
            {
                seq: 8,
                titleName: "번영로 528",
                address: "제주시 번영로 528",
                phone: "",
                boxQty: "마감",
                goods: "운행 종료 및 최종 도착 지점",
                note: "제주시 봉개동 제주봉개LH아파트 일원",
                arrTime: "15:58"
            }
        ];

        // 16일 오전 데이터 (이마트 -> 대정 우선 -> 이마트 복귀)
        const AM_DATA = [
            {
                seq: 1,
                titleName: "이홍주",
                address: "서귀포시 대정읍 상모로 14",
                phone: "010-8598-5327",
                boxQty: "35박스",
                goods: "동원 프리미엄 60호 (35)",
                note: "최남단 현대주유소 하차",
                arrTime: "10:01"
            },
            {
                seq: 2,
                titleName: "안덕신협",
                address: "서귀포시 안덕면 화순로 95",
                phone: "064-794-2201",
                boxQty: "29박스",
                goods: "청정원 S50호 (29)",
                note: "화순사거리 신협 본점",
                arrTime: "10:20"
            },
            {
                seq: 3,
                titleName: "이진영",
                address: "서귀포시 안덕면 중산간서로 1610",
                phone: "010-8660-5200",
                boxQty: "100박스",
                goods: "동원참치 S15 (93), 올리브 (4) 등 100박스",
                note: "세계자동차박물관 하차 구역 (대량 물량)",
                arrTime: "10:39"
            },
            {
                seq: 4,
                titleName: "권동재",
                address: "서귀포시 중문상로 82번길 45",
                phone: "010-5179-5611",
                boxQty: "16박스",
                goods: "동원 참치/리챔(10), 잔슨빌(2), 땅콩버터(4)",
                note: "103동 104호 (내비는 도로명만 복사)",
                arrTime: "11:07"
            },
            {
                seq: 5,
                titleName: "최상희",
                address: "서귀포시 대청로 12",
                phone: "010-6303-0276",
                boxQty: "15박스",
                goods: "사과&배 혼합 SET (10), 녹차원 베스트 (5)",
                note: "106동 201호 (혁신도시 LH아파트 / 이마트 1.3km 복귀)",
                arrTime: "11:24"
            },
            {
                seq: 6,
                titleName: "이마트 서귀포점",
                address: "서귀포시 일주동로 9209",
                phone: "064-797-1234",
                boxQty: "복귀",
                goods: "오전 운행 마감",
                note: "월드컵경기장 옆 이마트 복귀",
                arrTime: "11:32"
            }
        ];

        let currentTab = 'pm';
        let completedMap = {};

        // 모바일 사파리/크롬 완벽 호환 클립보드 복사 함수
        async function copyText(text, label) {
            let success = false;
            if (navigator.clipboard && window.isSecureContext) {
                try {
                    await navigator.clipboard.writeText(text);
                    success = true;
                } catch (e) {
                    success = false;
                }
            }

            if (!success) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.top = '0';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                try {
                    success = document.execCommand('copy');
                } catch (err) {
                    success = false;
                }
                document.body.removeChild(ta);
            }

            if (success) {
                showToast(`[${label}] 복사되었습니다: ${text}`);
            } else {
                window.prompt("아래 내용을 복사하세요:", text);
            }
        }

        // 전체 주소 리스트 복사
        function copyAllAddresses() {
            const list = currentTab === 'pm' ? PM_DATA : AM_DATA;
            const title = currentTab === 'pm' ? '16일 오후 배송 주소 리스트' : '16일 오전 배송 주소 리스트';
            let full = `[${title}]\n`;
            list.forEach(s => {
                full += `${s.seq} ${s.titleName}: ${s.address} (${s.boxQty}) - ${s.phone || '연락처 없음'}\n`;
            });
            copyText(full, "전체 목록");
        }

        // 토스트 팝업 제어
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toast-text');
            toastText.innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 1800);
        }

        // 탭 전환
        function switchTab(tabKey) {
            currentTab = tabKey;
            const btnPm = document.getElementById('tab-pm');
            const btnAm = document.getElementById('tab-am');
            const summaryDist = document.getElementById('summary-dist');
            const summaryQty = document.getElementById('summary-qty');
            const summaryFinish = document.getElementById('summary-finish');
            const routeDesc = document.getElementById('route-desc');

            if (tabKey === 'pm') {
                btnPm.className = "py-2 rounded-xl text-xs font-bold transition bg-sky-600 text-white shadow";
                btnAm.className = "py-2 rounded-xl text-xs font-bold transition bg-slate-800 text-slate-400";
                summaryDist.innerText = "53.9 km";
                summaryQty.innerText = "362 박스";
                summaryFinish.innerText = "15:58";
                routeDesc.innerText = "이마트 → 번영로 528";
            } else {
                btnAm.className = "py-2 rounded-xl text-xs font-bold transition bg-sky-600 text-white shadow";
                btnPm.className = "py-2 rounded-xl text-xs font-bold transition bg-slate-800 text-slate-400";
                summaryDist.innerText = "60.1 km";
                summaryQty.innerText = "195 박스";
                summaryFinish.innerText = "11:32";
                routeDesc.innerText = "대정 우선 → 이마트 복귀";
            }

            renderCards();
            updateProgress();
        }

        // 하차 완료 토글
        function toggleComplete(key) {
            completedMap[key] = !completedMap[key];
            renderCards();
            updateProgress();
        }

        // 완료율 업데이트
        function updateProgress() {
            const list = currentTab === 'pm' ? PM_DATA : AM_DATA;
            const total = list.length;
            let completedCount = 0;

            list.forEach(item => {
                const k = `${currentTab}_${item.seq}`;
                if (completedMap[k]) completedCount++;
            });

            const pct = Math.round((completedCount / total) * 100);
            document.getElementById('progress-stat').innerText = `${completedCount} / ${total}개소 (${pct}%)`;
        }

        // 카드 목록 렌더링
        function renderCards() {
            const list = currentTab === 'pm' ? PM_DATA : AM_DATA;
            const container = document.getElementById('cards-container');
            let html = '';

            list.forEach(item => {
                const uniqueKey = `${currentTab}_${item.seq}`;
                const isDone = !!completedMap[uniqueKey];
                const isFinal = item.seq === list.length;
                const titleStr = `${item.seq} ${item.titleName}`;

                html += `
                    <div class="border rounded-2xl p-3.5 transition duration-150 ${
                        isDone 
                            ? 'bg-slate-900/40 border-slate-800 opacity-60' 
                            : isFinal
                                ? 'bg-slate-900 border-amber-500/50 shadow-lg'
                                : 'bg-slate-900 border-slate-800 shadow-md'
                    }">
                        <!-- 카드 상단 -->
                        <div class="flex justify-between items-start mb-2.5">
                            <div class="flex items-center gap-2">
                                <span class="w-6 h-6 rounded-full text-xs font-black flex items-center justify-center ${
                                    isDone 
                                        ? 'bg-emerald-500 text-slate-950' 
                                        : isFinal ? 'bg-amber-400 text-slate-950' : 'bg-sky-500 text-slate-950'
                                }">
                                    ${isDone ? '<i class="fa-solid fa-check"></i>' : item.seq}
                                </span>
                                <div>
                                    <h2 class="font-bold text-sm ${isDone ? 'line-through text-slate-400' : 'text-white'}">
                                        ${titleStr}
                                    </h2>
                                    <span class="text-[11px] text-amber-400 font-medium">${item.goods}</span>
                                </div>
                            </div>
                            <div class="text-right">
                                <span class="font-mono text-xs font-bold text-sky-400 block">${item.arrTime} 도착</span>
                                <button onclick="toggleComplete('${uniqueKey}')" class="mt-1 text-[10px] px-2 py-0.5 rounded border ${
                                    isDone 
                                        ? 'bg-emerald-950 border-emerald-500/40 text-emerald-300' 
                                        : 'bg-slate-800 border-slate-700 text-slate-400'
                                }">
                                    ${isDone ? '하차완료' : '미완료'}
                                </button>
                            </div>
                        </div>

                        <!-- 참고 사항 및 상세 위치 -->
                        <div class="bg-slate-950/70 rounded-xl px-2.5 py-1.5 mb-3 text-[11px] text-slate-300 border border-slate-800/80 flex items-center justify-between">
                            <span class="truncate pr-2">
                                <i class="fa-solid fa-circle-info text-sky-400 mr-1"></i>
                                ${item.note}
                            </span>
                            <span class="font-bold text-slate-200 font-mono shrink-0">${item.boxQty}</span>
                        </div>

                        <!-- 1. 타이틀 복사 영역 -->
                        <div class="mb-2 bg-slate-950/80 border border-slate-800 rounded-xl p-2 flex items-center justify-between gap-2">
                            <div class="min-w-0 flex-1">
                                <span class="text-[9px] font-bold text-slate-500 block uppercase">타이틀</span>
                                <span class="text-xs font-mono font-bold text-slate-200 truncate block">${titleStr}</span>
                            </div>
                            <button onclick="copyText('${titleStr}', '타이틀')" class="shrink-0 bg-slate-800 hover:bg-slate-700 active:scale-95 px-2.5 py-1.5 rounded-lg text-xs font-bold text-sky-300 border border-slate-700 flex items-center gap-1">
                                <i class="fa-regular fa-copy text-[11px]"></i>
                                <span>타이틀 복사</span>
                            </button>
                        </div>

                        <!-- 2. 내비 주소 복사 영역 (정제 도로명) -->
                        <div class="mb-2 bg-slate-950/80 border border-slate-800 rounded-xl p-2 flex items-center justify-between gap-2">
                            <div class="min-w-0 flex-1">
                                <span class="text-[9px] font-bold text-slate-500 block uppercase">내비 주소</span>
                                <span class="text-xs font-mono font-bold text-amber-300 truncate block">${item.address}</span>
                            </div>
                            <button onclick="copyText('${item.address}', '주소')" class="shrink-0 bg-sky-600 hover:bg-sky-500 active:scale-95 px-2.5 py-1.5 rounded-lg text-xs font-bold text-white shadow flex items-center gap-1">
                                <i class="fa-solid fa-location-arrow text-[11px]"></i>
                                <span>주소 복사</span>
                            </button>
                        </div>

                        <!-- 3. 전화번호 복사 및 바로통화 -->
                        ${item.phone ? `
                            <div class="bg-slate-950/80 border border-slate-800 rounded-xl p-2 flex items-center justify-between gap-2">
                                <div class="min-w-0 flex-1">
                                    <span class="text-[9px] font-bold text-slate-500 block uppercase">연락처</span>
                                    <span class="text-xs font-mono font-bold text-slate-200 truncate block">${item.phone}</span>
                                </div>
                                <div class="flex gap-1 shrink-0">
                                    <button onclick="copyText('${item.phone}', '전화번호')" class="bg-slate-800 hover:bg-slate-700 active:scale-95 px-2 py-1.5 rounded-lg text-xs font-bold text-slate-300 border border-slate-700">
                                        번호 복사
                                    </button>
                                    <a href="tel:${item.phone}" class="bg-emerald-700 hover:bg-emerald-600 active:scale-95 px-2.5 py-1.5 rounded-lg text-xs font-bold text-white shadow flex items-center gap-1">
                                        <i class="fa-solid fa-phone text-[10px]"></i>
                                        <span>통화</span>
                                    </a>
                                </div>
                            </div>
                        ` : `
                            <div class="text-[11px] text-slate-500 text-center py-1">
                                전화번호 없음 (운행 마감 지점)
                            </div>
                        `}
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // 초기 실행
        renderCards();
        updateProgress();
    </script>
</body>
</html>
